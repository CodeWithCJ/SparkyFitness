name: PR License Enforcement

# `pull_request_target` in pr-validation.yml only fires on PR activity, so an abandoned PR never
# emits another event. This timer sweeps every open PR and closes the ones that never recorded a
# license agreement.

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-license-enforcement
  cancel-in-progress: false

jobs:
  enforce:
    name: Close PRs without a license agreement
    runs-on: ubuntu-latest

    steps:
      - name: Sweep open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const LICENSE_LABEL = 'needs-license-agreement';
            const LICENSE_ITEM  = '[MANDATORY - ALL] Integrity & License';
            const GRACE_MS      = 24 * 60 * 60 * 1000;
            const BOT_TAG       = '<!-- license-enforcement-bot -->';

            // Only the maintainer is exempt; everyone else must record the agreement.
            const EXEMPT_AUTHORS = ['CodeWithCJ'];

            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            // Same matcher as pr-validation.yml: "- [x] **<item>"
            const escapeRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const checked = (body, str) =>
              new RegExp(`-\\s*\\[[xX]\\]\\s*\\*\\*${escapeRegex(str)}`, 'i').test(body || '');

            // ---- Ensure the label exists ----
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LICENSE_LABEL,
                color: 'b60205',
                description: 'License checkbox not ticked; PR closes 24h after this label was applied',
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 422 = already exists
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const warned = [];
            const closed = [];
            const cleared = [];

            for (const pr of pulls) {
              const author = pr.user?.login ?? '';
              if (EXEMPT_AUTHORS.includes(author)) continue;

              const hasLabel = pr.labels.some(l => l.name === LICENSE_LABEL);

              // ---- Agreement recorded: cancel any countdown ----
              if (checked(pr.body, LICENSE_ITEM)) {
                if (hasLabel) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner, repo, issue_number: pr.number, name: LICENSE_LABEL,
                    });
                    cleared.push(pr.number);
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                continue;
              }

              // ---- No agreement, countdown not started: label + warn ----
              if (!hasLabel) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: [LICENSE_LABEL],
                });

                const deadline = new Date(Date.now() + GRACE_MS).toISOString().replace('T', ' ').slice(0, 16);

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: [
                    BOT_TAG,
                    `@${author} thanks for the contribution! ⚠️ **This PR is missing the mandatory license agreement.**`,
                    '',
                    'Our PR template contains a checkbox that records your agreement to the project license.',
                    'It is either unticked or was removed when the template was replaced. We cannot review or',
                    'merge a contribution without it.',
                    '',
                    '**What to do (takes 10 seconds, no new commit needed):**',
                    '',
                    '1. Click **Edit** on the PR description above.',
                    '2. Make sure this line is present and ticked:',
                    '',
                    '   ```markdown',
                    '   - [x] **[MANDATORY - ALL] Integrity & License**: I certify this is my own work, free of malicious code, and I agree to the [License terms](https://github.com/CodeWithCJ/SparkyFitness/blob/main/LICENSE).',
                    '   ```',
                    '',
                    '3. Save. The `PR Checks` workflow re-runs and this label is removed automatically.',
                    '',
                    `⏳ **If this is not done by \`${deadline} UTC\` (24 hours), this PR will be closed automatically.**`,
                    'Please also keep the rest of the PR template checklist in the description — it is how we',
                    'track what still needs verifying.',
                  ].join('\n'),
                });

                warned.push(pr.number);
                continue;
              }

              // ---- No agreement, countdown running: close if the grace period lapsed ----
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });

              const labeledAt = events
                .filter(e => e.event === 'labeled' && e.label?.name === LICENSE_LABEL)
                .map(e => new Date(e.created_at).getTime())
                .sort((a, b) => b - a)[0];

              // Label present but no readable event (very old PR, or events truncated): restart the
              // clock rather than closing on unknown timing.
              if (!labeledAt) {
                core.warning(`PR #${pr.number}: no 'labeled' event found for ${LICENSE_LABEL}; skipping this run.`);
                continue;
              }

              const elapsed = Date.now() - labeledAt;
              if (elapsed < GRACE_MS) {
                const hoursLeft = Math.ceil((GRACE_MS - elapsed) / (60 * 60 * 1000));
                core.info(`PR #${pr.number}: ${hoursLeft}h left before auto-close.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: [
                  BOT_TAG,
                  `@${author} closing this PR: the **[MANDATORY - ALL] Integrity & License** checkbox was not`,
                  'ticked within 24 hours of being requested, so we have no recorded agreement to the',
                  '[project license](https://github.com/CodeWithCJ/SparkyFitness/blob/main/LICENSE) for this contribution.',
                  '',
                  'This is not a judgement on the code — it is a licensing requirement we cannot waive.',
                  '',
                  '**This is easy to undo.** Tick the box in the PR description and reopen the PR (or leave a',
                  'comment and a maintainer will reopen it for you). Your commits and review history are unchanged.',
                ].join('\n'),
              });

              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, state: 'closed',
              });

              closed.push(pr.number);
            }

            const summary = [
              '## PR License Enforcement',
              '',
              `- Open PRs scanned: **${pulls.length}**`,
              `- Countdown started (labeled + warned): **${warned.length}**${warned.length ? ` — ${warned.map(n => '#' + n).join(', ')}` : ''}`,
              `- Closed after 24h: **${closed.length}**${closed.length ? ` — ${closed.map(n => '#' + n).join(', ')}` : ''}`,
              `- Agreement recorded, label cleared: **${cleared.length}**${cleared.length ? ` — ${cleared.map(n => '#' + n).join(', ')}` : ''}`,
            ].join('\n');

            await core.summary.addRaw(summary).write();
            core.info(summary);
