name: PR License Enforcement

# `pull_request_target` in pr-validation.yml only fires on PR activity, so an abandoned PR never
# emits another event. This timer sweeps every open PR and closes the ones that never recorded a
# license agreement.
#
# Exemptions (bots, maintainers, automation branches) live in .github/scripts/pr-policy.cjs so this
# workflow and pr-validation.yml can never disagree about who is enforced.

on:
  schedule:
    - cron: '0 * * * *' # hourly
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-license-enforcement
  cancel-in-progress: false

jobs:
  enforce:
    name: Close PRs without a license agreement
    runs-on: ubuntu-latest

    steps:
      # Scheduled runs always check out the default branch, so this is repo-owned code.
      - name: Check out policy rules
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sweep open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const policy = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-policy.cjs`);

            const { LICENSE_LABEL, LICENSE_ITEM, LICENSE_ITEM_TEXT, GRACE_MS } = policy;
            const BOT_TAG = '<!-- license-enforcement-bot -->';
            const GRACE_HOURS = Math.round(GRACE_MS / (60 * 60 * 1000));

            const owner = context.repo.owner;
            const repo  = context.repo.repo;

            const addLabel = pr => github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number, labels: [LICENSE_LABEL],
            });

            const dropLabel = async pr => {
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: pr.number, name: LICENSE_LABEL,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            };

            // ---- Ensure the label exists ----
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: LICENSE_LABEL,
                color: policy.LICENSE_LABEL_COLOR,
                description: policy.LICENSE_LABEL_DESCRIPTION,
              });
            } catch (error) {
              if (error.status !== 422) throw error; // 422 = already exists
            }

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const warned   = [];
            const closed   = [];
            const cleared  = [];
            const exempted = [];
            const drafts   = [];

            for (const pr of pulls) {
              const author   = pr.user?.login ?? '';
              const hasLabel = pr.labels.some(l => l.name === LICENSE_LABEL);

              // ---- Exempt: our own automation and maintainers ----
              // Never label, never warn, never close. Clear a stale label if one is present.
              const exemption = policy.getExemption(pr);
              if (exemption.exempt) {
                if (hasLabel) { await dropLabel(pr); cleared.push(pr.number); }
                exempted.push(`#${pr.number} (${exemption.reason})`);
                continue;
              }

              // ---- Draft: pause the countdown ----
              // Dropping the label stops the clock. pr-validation.yml re-applies it on
              // `ready_for_review`, which starts a fresh grace period rather than resuming an
              // expired one.
              if (pr.draft) {
                if (hasLabel) { await dropLabel(pr); cleared.push(pr.number); }
                drafts.push(pr.number);
                continue;
              }

              // ---- Agreement recorded: cancel any countdown ----
              if (policy.isChecked(pr.body, LICENSE_ITEM)) {
                if (hasLabel) { await dropLabel(pr); cleared.push(pr.number); }
                continue;
              }

              // ---- No agreement: make sure the contributor has actually been told ----
              // The grace period runs from the moment we explain the problem, never from a
              // silently applied label. If no warning comment exists yet (label applied by
              // pr-validation.yml, or predating this workflow), post one and restart the clock.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const alreadyWarned = comments.some(c => (c.body ?? '').includes(BOT_TAG));

              if (!alreadyWarned) {
                if (hasLabel) await dropLabel(pr);
                await addLabel(pr); // fresh `labeled` event = clock starts now
                const deadline = new Date(Date.now() + GRACE_MS)
                  .toISOString().replace('T', ' ').slice(0, 16);

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: [
                    BOT_TAG,
                    `@${author} thanks for the contribution! ⚠️ **This PR is missing the mandatory license agreement.**`,
                    '',
                    'This project can only accept contributions from people who have agreed to the terms in',
                    'our [LICENSE](https://github.com/CodeWithCJ/SparkyFitness/blob/main/LICENSE). Our PR template',
                    'contains a checkbox that records that agreement, and it is either unticked or was removed',
                    'when the template was replaced. Without it we have no record of your permission to ship your',
                    'code, so we cannot review or merge it.',
                    '',
                    '**What to do (takes 10 seconds, no new commit needed):**',
                    '',
                    '1. Click **Edit** on the PR description above.',
                    '2. Make sure this line is present and ticked:',
                    '',
                    '   ```markdown',
                    `   - [x] ${LICENSE_ITEM_TEXT}`,
                    '   ```',
                    '',
                    '3. Save. The `PR Checks` workflow re-runs and this label is removed automatically.',
                    '',
                    `⏳ **If this is not done by \`${deadline} UTC\` (${GRACE_HOURS} hours), this PR will be closed automatically.**`,
                    'Please also keep the rest of the PR template checklist in the description — it is how we',
                    'track what still needs verifying.',
                  ].join('\n'),
                });

                warned.push(pr.number);
                continue;
              }

              // ---- Warned already: has the grace period lapsed? ----
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });

              const labeledAt = events
                .filter(e => e.event === 'labeled' && e.label?.name === LICENSE_LABEL)
                .map(e => new Date(e.created_at).getTime())
                .sort((a, b) => b - a)[0];

              // Label present but no readable event. Re-apply it so there IS a timestamp, and
              // grant a full grace period rather than closing on unknown timing.
              if (!labeledAt) {
                core.warning(`PR #${pr.number}: no 'labeled' event found for ${LICENSE_LABEL}; restarting the clock.`);
                await dropLabel(pr);
                await addLabel(pr);
                continue;
              }

              const elapsed = Date.now() - labeledAt;
              if (elapsed < GRACE_MS) {
                const hoursLeft = Math.ceil((GRACE_MS - elapsed) / (60 * 60 * 1000));
                core.info(`PR #${pr.number}: ${hoursLeft}h left before auto-close.`);
                continue;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: [
                  BOT_TAG,
                  `@${author} **closing this PR — we did not receive your agreement to the project license.**`,
                  '',
                  `We can only accept pull requests from contributors who confirm they agree to the terms and`,
                  `conditions in our [LICENSE](https://github.com/CodeWithCJ/SparkyFitness/blob/main/LICENSE), and`,
                  `who certify the contribution is their own work and free of malicious code. That confirmation is`,
                  `recorded by ticking the **${LICENSE_ITEM}** checkbox in the PR description.`,
                  '',
                  `That box was not ticked within ${GRACE_HOURS} hours of us asking, so we have no recorded`,
                  'agreement for this contribution and cannot review or merge it.',
                  '',
                  '**To be clear: this is not a judgement on your code.** It is a licensing requirement we are not',
                  'able to waive for any contribution, however good it is. We appreciate the time you put in.',
                  '',
                  '**This is easy to undo and you are very welcome to continue.** Tick the box in the PR',
                  'description and reopen the PR (or leave a comment here and a maintainer will reopen it for',
                  'you). Your commits, reviews and discussion are all preserved exactly as they are — nothing is',
                  'lost by this close.',
                  '',
                  'The line to tick:',
                  '',
                  '```markdown',
                  `- [x] ${LICENSE_ITEM_TEXT}`,
                  '```',
                ].join('\n'),
              });

              await github.rest.pulls.update({
                owner, repo, pull_number: pr.number, state: 'closed',
              });

              closed.push(pr.number);
            }

            const list = arr => (arr.length ? ` — ${arr.map(n => (typeof n === 'number' ? '#' + n : n)).join(', ')}` : '');

            const summary = [
              '## PR License Enforcement',
              '',
              `- Open PRs scanned: **${pulls.length}**`,
              `- Exempt (bots / maintainers / automation branches): **${exempted.length}**${list(exempted)}`,
              `- Drafts skipped (countdown paused): **${drafts.length}**${list(drafts)}`,
              `- Warned, countdown started: **${warned.length}**${list(warned)}`,
              `- Closed after ${GRACE_HOURS}h: **${closed.length}**${list(closed)}`,
              `- Label cleared: **${cleared.length}**${list(cleared)}`,
            ].join('\n');

            await core.summary.addRaw(summary).write();
            core.info(summary);
