name: First-Time Contributor Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome First-Time Contributor
    runs-on: ubuntu-latest

    steps:
      - name: Send Welcome Message
        uses: actions/github-script@v7
        with:
          script: |
            const isPR = Boolean(context.payload.pull_request);
            const item = context.payload.pull_request || context.payload.issue;
            const author = item?.user?.login;
            const isBot = item?.user?.type === 'Bot';
            const authorAssociation = item?.author_association;

            // Skip bots and repository owners/collaborators
            if (!author || isBot || authorAssociation === 'OWNER') {
              core.info(`Skipping welcome for ${author} (type: ${item?.user?.type}, association: ${authorAssociation}).`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (isPR) {
              const allItems = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'all',
                creator: author,
                per_page: 10,
              });

              const userPRs = allItems.filter(i => Boolean(i.pull_request));

              // If this is their first PR
              if (userPRs.length === 1) {
                const commentBody = [
                  '<!-- first-pr-welcome -->',
                  `👋 Welcome @${author} and thank you for opening your first pull request in SparkyFitness! 🎉`,
                  '',
                  'We appreciate your contribution! Our team will review your PR soon. Please make sure the mandatory questionnaire checkboxes in your description are completed so checks can run smoothly.',
                ].join('\n');

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: item.number,
                  body: commentBody,
                });

                core.info(`Posted first-time PR welcome comment for ${author}.`);
              } else {
                core.info(`${author} has ${userPRs.length} PRs; not their first PR.`);
              }
            } else {
              // Issue handling
              const allItems = await github.paginate(github.rest.issues.listForRepo, {
                owner,
                repo,
                state: 'all',
                creator: author,
                per_page: 10,
              });

              const pureIssues = allItems.filter(i => !i.pull_request);

              // If this is their first issue
              if (pureIssues.length === 1) {
                const isFeature =
                  item.labels?.some(l => l.name === 'enhancement' || l.name === 'feature') ||
                  /\[Feature\]/i.test(item.title) ||
                  /(feature request|what feature)/i.test(item.body || '');

                let commentBody = '';
                if (isFeature) {
                  commentBody = [
                    '<!-- first-issue-welcome -->',
                    `👋 Welcome @${author} and thank you for opening your first **feature request** for SparkyFitness! 💡`,
                    '',
                    'We appreciate you taking the time to share your ideas and feedback with the community.',
                    '',
                    '> [!NOTE]',
                    '> **Prioritization & Timeline:** Bug fixes and issues are generally prioritized over new feature requests. If you do not hear back right away, please know we have not forgotten — feature priorities depend on overall impact, community interest (👍 reactions), and development bandwidth.',
                  ].join('\n');
                } else {
                  commentBody = [
                    '<!-- first-issue-welcome -->',
                    `👋 Welcome @${author} and thank you for opening your first **issue** in SparkyFitness! 🌟`,
                    '',
                    'We appreciate you taking the time to report this and help improve SparkyFitness. Our team will review the details soon!',
                  ].join('\n');
                }

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: item.number,
                  body: commentBody,
                });

                core.info(`Posted first-time ${isFeature ? 'feature request' : 'issue'} welcome comment for ${author}.`);
              } else {
                core.info(`${author} has ${pureIssues.length} issues; not their first issue.`);
              }
            }
