name: PR Validation Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/**'
              - 'SparkyFitnessServer/locales/**'
              - 'SparkyFitnessFrontend/public/locales/**'
              - 'SparkyFitnessMobile/src/localization/locales/**'
              - 'SparkyFitnessMobile/locales/**'
              - 'SparkyFitnessMobile/targets/**'
      - if: steps.filter.outputs.relevant == 'true' || github.event_name == 'push'
        uses: pnpm/action-setup@v4
      - if: steps.filter.outputs.relevant == 'true' || github.event_name == 'push'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: steps.filter.outputs.relevant == 'true' || github.event_name == 'push'
        run: pnpm install --filter . --frozen-lockfile --ignore-scripts
      - if: steps.filter.outputs.relevant == 'true' || github.event_name == 'push'
        run: node --test .github/scripts/pr-validation.test.cjs .github/scripts/automation-allowlist.test.cjs
