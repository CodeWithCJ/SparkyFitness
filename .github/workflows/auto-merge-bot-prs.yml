name: Auto-Merge Bot PRs

# Merges the translations PR that automation opens, once its checks pass. The
# Nix hashes and schema backup PRs merge themselves in their own workflows. It merges with the SparkyFitness-Sync GitHub App token: main's ruleset
# requires a review, and the app is on its bypass list, while GITHUB_TOKEN is not.
# Nothing here checks out or runs code from the PR.

on:
  pull_request_target:
    types: [opened, synchronize, labeled, ready_for_review]
  # check_suite never fires for suites created by GitHub Actions, so CI finishing
  # is caught here instead.
  workflow_run:
    workflows: ["CI Tests"]
    types: [completed]
  check_suite:
    types: [completed]
  workflow_dispatch:

# Every call goes through the app token, so GITHUB_TOKEN gets nothing.
permissions: {}

# One group per PR or commit. A single shared group keeps only one pending run,
# so the run started by CI finishing could be replaced by another PR's run and
# the merge never tried. Two runs for the same PR are harmless: the merge is
# pinned to the head SHA, and the second one finds the PR closed.
concurrency:
  group: auto-merge-bot-prs-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Auto-Merge Translations and Nix PRs
    # Only create the app token for events that can concern an automation PR from
    # this repository. The script below checks again, with the full PR data.
    if: >-
      github.repository == 'CodeWithCJ/SparkyFitness' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'i18n/')) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
          startsWith(github.event.workflow_run.head_branch, 'i18n/')) ||
        (github.event_name == 'check_suite' &&
          startsWith(github.event.check_suite.head_branch, 'i18n/'))
      )
    # The app secrets live in this environment, which only main can use, so a
    # workflow pushed on another branch cannot read them.
    environment: sync-app
    runs-on: ubuntu-latest

    steps:
      # The default branch's copy of the allowlist, never the PR's: on every
      # trigger here the checkout is main, and no PR code is checked out.
      - name: Checkout the allowlist
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Create SparkyFitness-Sync token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The app's Client ID is not secret, so it lives here, not in a secret.
          client-id: Iv23lizuGhwaizMxrvDT
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          # Only what reading checks and merging needs.
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Check and Merge Clean Automation PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Allowed branch prefixes for safe auto-merging. Pushing one of these
            // branches here needs write access; a label alone is not enough, because
            // anyone with triage access can add one and this token skips review.
            const ALLOWED_BRANCH_PREFIXES = ['i18n/'];

            // Files each automation branch may change, shared with sync-translations.yml.
            const { outsideAllowlist, valuesWithAttributes } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automation-allowlist.cjs`);

            // Helper: determine if a PR is an allowed automated PR
            function isEligible(pr) {
              // 1. Must originate from within this repository (reject all forks)
              const headRepo = pr.head?.repo?.full_name;
              const baseRepo = pr.base?.repo?.full_name;
              if (!headRepo || !baseRepo || headRepo !== baseRepo) return false;

              // 2. Must be authored by a bot or repository owner
              const isBot = pr.user?.type === 'Bot' || pr.user?.login?.endsWith('[bot]');
              const isOwner = pr.user?.login === owner || pr.author_association === 'OWNER';
              if (!isBot && !isOwner) return false;

              // 3. Must come from an automation branch
              const headRef = pr.head?.ref || '';
              return ALLOWED_BRANCH_PREFIXES.some(prefix => headRef.startsWith(prefix));
            }

            // 1. Gather candidate PRs to inspect
            let candidatePRs = [];

            if (context.eventName === 'pull_request_target') {
              candidatePRs = [context.payload.pull_request];
            } else if (context.eventName === 'check_suite' || context.eventName === 'workflow_run') {
              const source = context.payload.check_suite || context.payload.workflow_run;
              const suitePRs = source?.pull_requests || [];
              if (suitePRs.length > 0) {
                candidatePRs = suitePRs;
              } else {
                // If the payload does not list PRs directly, search open PRs with matching head SHA
                const headSha = source?.head_sha;
                if (headSha) {
                  const openPulls = await github.paginate(github.rest.pulls.list, {
                    owner,
                    repo,
                    state: 'open',
                    per_page: 100,
                  });
                  candidatePRs = openPulls.filter(p => p.head.sha === headSha);
                }
              }
            } else {
              // workflow_dispatch sweep: all open PRs
              candidatePRs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
            }

            if (candidatePRs.length === 0) {
              core.info('No candidate PRs to evaluate.');
              return;
            }

            for (const item of candidatePRs) {
              // Fetch latest PR data for complete mergeable state and labels
              let pr;
              try {
                const res = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: item.number,
                });
                pr = res.data;
              } catch (err) {
                core.warning(`Failed to fetch details for PR #${item.number}: ${err.message}`);
                continue;
              }

              if (pr.state !== 'open') {
                core.info(`PR #${pr.number} is ${pr.state}, skipping.`);
                continue;
              }

              if (pr.draft) {
                core.info(`PR #${pr.number} is a draft, skipping.`);
                continue;
              }

              const headRef = pr.head?.ref || '';
              if (!isEligible(pr)) {
                core.info(`PR #${pr.number} (${headRef}) is not an eligible translation automation PR.`);
                continue;
              }

              core.info(`Evaluating eligible automation PR #${pr.number} (${headRef})...`);

              // 2. Check mergeability & conflicts
              // If GitHub is currently calculating mergeability (null), wait briefly and retry once
              if (pr.mergeable === null) {
                core.info(`PR #${pr.number} mergeability is null (calculating). Waiting 3 seconds...`);
                await new Promise(r => setTimeout(r, 3000));
                const retry = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                });
                pr = retry.data;
              }

              if (pr.mergeable === false || pr.mergeable_state === 'dirty' || pr.mergeable_state === 'conflicting') {
                core.warning(
                  `⚠️ PR #${pr.number} (${headRef}) has merge conflicts (mergeable_state: '${pr.mergeable_state}'). ` +
                  'Skipping auto-merge to wait for manual maintainer review.'
                );
                continue;
              }

              // 3. Check the files of this exact head, after the mergeability retry
              // above may have fetched a newer one. The merge below is pinned to
              // headSha, so a push after this point makes it fail, not slip through.
              const headSha = pr.head.sha;
              // List the files of headSha itself, not the PR's current head, so a
              // push and restore around this call cannot swap in another listing.
              // The compare API returns at most 300 files; a larger PR no longer
              // matches its changed_files count and is left for a maintainer.
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${pr.base.sha}...${headSha}`,
              });
              const files = comparison.files || [];
              if (files.length !== pr.changed_files) {
                core.warning(
                  `PR #${pr.number} reports ${pr.changed_files} changed files but ${files.length} were listed. ` +
                  'Skipping auto-merge; a maintainer must review it.'
                );
                continue;
              }
              const outside = outsideAllowlist(headRef, files.flatMap(f => [f.filename, f.previous_filename]));
              if (outside.length > 0) {
                core.warning(
                  `PR #${pr.number} changes files outside its allowlist (${outside.slice(0, 5).join(', ')}). ` +
                  'Skipping auto-merge; a maintainer must review it.'
                );
                continue;
              }

              // Paths are not enough: <Trans> lets attributes in a value override
              // a link's href, target and rel. Parse each changed catalogue as it
              // stands at headSha, since JSON escapes such as \u003c hide a tag
              // from the raw diff. A file that cannot be read or parsed counts as
              // a finding, not a pass.
              const unsafe = [];
              for (const f of files) {
                if (!f.filename.endsWith('.json') || f.status === 'removed') continue;
                try {
                  const { data } = await github.rest.repos.getContent({ owner, repo, path: f.filename, ref: headSha });
                  const text = data.encoding === 'base64' && data.content ? Buffer.from(data.content, 'base64').toString('utf8') : null;
                  if (text === null || valuesWithAttributes(text).length > 0) unsafe.push(f);
                } catch (err) {
                  unsafe.push(f);
                }
              }
              if (unsafe.length > 0) {
                core.warning(
                  `PR #${pr.number} has values with attributes in a tag, or a catalogue that could not be checked ` +
                  `(${unsafe.slice(0, 5).map(f => f.filename).join(', ')}). Skipping auto-merge; a maintainer must review it.`
                );
                continue;
              }

              // 4. Verify CI check runs and commit status

              const checkRunsRes = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });

              const checkRuns = (checkRunsRes.data?.check_runs || []).filter(
                r => r.name !== 'Auto-Merge Translations and Nix PRs' && r.name !== context.job
              );

              const hasFailingCheck = checkRuns.some(
                r => r.conclusion === 'failure' || r.conclusion === 'timed_out' || r.conclusion === 'cancelled'
              );

              const hasPendingCheck = checkRuns.some(
                r => r.status !== 'completed'
              );

              if (hasFailingCheck) {
                core.warning(`PR #${pr.number} has failing CI check runs. Skipping auto-merge.`);
                continue;
              }

              if (hasPendingCheck) {
                core.info(`PR #${pr.number} has pending CI check runs. Waiting for completion.`);
                continue;
              }

              // Also check combined status API (for status-based CI)
              const combinedStatus = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref: headSha,
              });

              if (combinedStatus.data.state === 'failure') {
                core.warning(`PR #${pr.number} has failing commit status. Skipping auto-merge.`);
                continue;
              }

              if (combinedStatus.data.state === 'pending' && combinedStatus.data.total_count > 0) {
                core.info(`PR #${pr.number} has pending commit status. Waiting for completion.`);
                continue;
              }

              if (checkRuns.length === 0 && combinedStatus.data.total_count === 0) {
                core.info(`PR #${pr.number} has no check runs or statuses yet. Waiting.`);
                continue;
              }

              // 5. Merge the clean PR
              try {
                core.info(`All checks passed and no conflicts found. Auto-merging PR #${pr.number} (${headRef})...`);
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  sha: headSha,
                  merge_method: 'squash',
                  commit_title: `${pr.title} (#${pr.number})`,
                });
                core.info(`🎉 Successfully auto-merged PR #${pr.number}!`);
              } catch (err) {
                core.error(`Failed to merge PR #${pr.number}: ${err.message}`);
              }
            }
