name: Close Inactive Draft PRs

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  pull_request_target:
    types: [opened, converted_to_draft]
  workflow_dispatch: # Allows manual trigger from Actions tab for testing

permissions:
  pull-requests: write
  issues: write

jobs:
  notify-draft:
    name: Notify on Draft PR
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Post Draft Inactivity Notice
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if notice was already posted
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const alreadyNotified = comments.some(c =>
              c.body && c.body.includes('Draft PR Notice')
            );

            if (alreadyNotified) {
              console.log(`Notice already posted on PR #${prNumber}. Skipping.`);
              return;
            }

            const noticeBody = [
              '> ℹ️ **Draft PR Notice:** This draft PR will be automatically closed after **7 days of inactivity** (measured from the latest commit).',
              '> Repository maintainers can comment `/keep-draft` to keep it open indefinitely (or `/allow-close` to re-enable auto-closure).',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body: noticeBody,
            });
            console.log(`Posted draft notice on PR #${prNumber}.`);

  close-drafts:
    name: Close Inactive Draft PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Close draft PRs inactive for 7 days
        uses: actions/github-script@v7
        with:
          script: |
            const SEVEN_DAYS_MS = 7 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            // Fetch all open pull requests across all pages
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of prs) {
              // Only target draft pull requests
              if (!pr.draft) continue;

              try {
                // 1. Fetch all comments in order to evaluate /keep-draft or /allow-close commands
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                });
                comments.sort((a, b) => a.id - b.id);

                let isExcluded = false;
                for (const comment of comments) {
                  // Safely read commenter username with null guard against deleted accounts
                  const login = comment.user?.login?.toLowerCase();
                  const isAuthorized =
                    login === 'codewithcj' ||
                    login === context.repo.owner.toLowerCase() ||
                    ['OWNER', 'COLLABORATOR', 'MEMBER'].includes(comment.author_association);

                  if (!isAuthorized) continue;

                  const body = (comment.body || '').trim().toLowerCase();
                  if (body.includes('/keep-draft') || body.includes('/no-autoclose')) {
                    isExcluded = true;
                  } else if (body.includes('/allow-close')) {
                    isExcluded = false; // Override back to normal
                  }
                }

                if (isExcluded) {
                  console.log(`PR #${pr.number} is marked with /keep-draft by an authorized collaborator. Skipping.`);
                  continue;
                }

                // 2. Fetch the commit identified by pr.head.sha to inspect the latest commit timestamp
                const { data: latestCommit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                });

                const commitDateStr =
                  latestCommit.commit.committer?.date ||
                  latestCommit.commit.author?.date;
                const lastCommitTime = new Date(commitDateStr).getTime();
                const timeSinceLastCommit = now - lastCommitTime;

                // If the author has pushed within the last 7 days, keep it open
                if (timeSinceLastCommit < SEVEN_DAYS_MS) {
                  const daysAgo = (timeSinceLastCommit / (1000 * 60 * 60 * 24)).toFixed(1);
                  console.log(`PR #${pr.number} had a commit ${daysAgo} days ago (< 7 days). Keeping open.`);
                  continue;
                }

                // 3. Re-verify PR status before taking action to prevent race conditions
                const { data: currentPr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });

                if (!currentPr.draft || currentPr.state !== 'open') {
                  console.log(`PR #${pr.number} is no longer open or no longer a draft. Skipping closure.`);
                  continue;
                }

                console.log(`Closing PR #${pr.number}: inactive for >7 days since last commit.`);

                // 4. Post notification comment and close the PR
                const closeMessage = [
                  'This draft PR had no new commits for 7 days and was automatically closed.',
                  '',
                  'Feel free to **Reopen** when ready! Please ensure:',
                  '- Reviewer feedback and bot comments (CodeRabbit/Strix/CI) are resolved.',
                  '- Validation proof (screenshots or test logs) is attached.',
                  '- Marked **Ready for review**.',
                  '',
                  '*(Maintainers: comment `/keep-draft` to keep open)*',
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: closeMessage,
                });

                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  state: 'closed',
                });
              } catch (err) {
                console.error(`Error processing draft PR #${pr.number}:`, err);
              }
            }
