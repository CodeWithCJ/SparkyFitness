name: Update Nix pnpm Hashes

# When the pnpm lockfile changes on main, the vendored pnpm dependency hashes in
# nix/backend.nix and nix/frontend.nix go stale and Nix builds fail. This
# workflow recomputes them with nix/update-hashes.sh and opens a PR if anything
# changed. Nix is a community-maintained, untested integration, so this only
# runs when the lockfile actually moves.
#
# The PR merges itself: its content is computed here from main, so a review
# adds nothing. The merge runs in its own job with the SparkyFitness-Sync app
# token, which can merge past main's review rule; the job that runs the Nix
# installer and the update script never sees that token.

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "nix/update-hashes.sh"
      - ".github/workflows/nix-update-hashes.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Both jobs force-push or merge the same branch, so runs never overlap.
concurrency:
  group: nix-update-hashes
  cancel-in-progress: false

jobs:
  update-hashes:
    name: Recompute pnpm deps hashes
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run hash update script
        run: nix/update-hashes.sh

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(nix): update pnpm deps hashes"
          branch: nix/update-pnpm-hashes
          delete-branch: true
          base: main
          title: "chore(nix): update pnpm deps hashes"
          body: |
            This pull request was automatically created by the **Update Nix pnpm Hashes** workflow after `pnpm-lock.yaml` changed on `main`.

            It reruns `nix/update-hashes.sh` to recompute the vendored pnpm dependency hashes in `nix/backend.nix` and `nix/frontend.nix` so the Nix packages keep building.

            The workflow merges this pull request right after opening it. If it is still open, the merge failed: merge it by hand.

            > [!NOTE]
            > The Nix integration is a community contribution and is not tested by the maintainers.
          labels: |
            nix

  merge:
    name: Merge the hashes PR
    needs: update-hashes
    # "closed" means the hashes already match main and the PR was closed.
    if: needs.update-hashes.outputs.pr != '' && needs.update-hashes.outputs.operation != 'closed' && github.ref == 'refs/heads/main'
    # The app secrets live in this environment, which only main can use.
    environment: sync-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the merge action
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Create SparkyFitness-Sync token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The app's Client ID is not secret, so it lives here, not in a secret.
          client-id: Iv23lizuGhwaizMxrvDT
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Merge
        uses: ./.github/actions/merge-automation-pr
        with:
          token: ${{ steps.app_token.outputs.token }}
          repository: ${{ github.repository }}
          pull-request: ${{ needs.update-hashes.outputs.pr }}
          head-sha: ${{ needs.update-hashes.outputs.head-sha }}
