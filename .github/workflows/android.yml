name: Build Android APK

# Runs on publish rather than on the v* tag push. release-please.yml creates the
# tag together with the draft, before anyone has approved the release, and a tag
# pushed with GITHUB_TOKEN would not trigger this workflow at all. On a release
# event github.ref is still refs/tags/<tag>, so the steps below are unchanged.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx6144m -XX:MaxMetaspaceSize=1024m\" -Dorg.gradle.caching=true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          pnpm install --frozen-lockfile
          cd SparkyFitnessMobile
          APP_VARIANT=production npx expo prebuild --platform android
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m/' android/gradle.properties
          sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64/' android/gradle.properties
          printf '\norg.gradle.caching=true\n' >> android/gradle.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-Wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x SparkyFitnessMobile/android/gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties

      - name: Decode and setup keystore
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
          echo "Keystore created at: $(pwd)/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore"
          ls -la SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore

      - name: Generate async-storage codegen
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :react-native-async-storage_async-storage:generateCodegenArtifactsFromSchema

      - name: Verify codegen was generated
        run: |
          if [ -d "SparkyFitnessMobile/node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni/" ]; then
            echo "✅ Codegen directory exists"
            ls -la SparkyFitnessMobile/node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni/
          else
            echo "❌ Codegen directory NOT found"
          fi

      - name: Build Release APK
        if: github.event_name != 'pull_request'
        env:
          SPARKY_RELEASE_STORE_FILE: ${{ github.workspace }}/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
          SPARKY_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPARKY_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SPARKY_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:assembleRelease --stacktrace

      - name: Get APK path
        if: github.event_name != 'pull_request'
        id: apk
        run: |
          APK_PATH=$(find SparkyFitnessMobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT

      - name: Build Release AAB
        if: github.event_name != 'pull_request'
        env:
          SPARKY_RELEASE_STORE_FILE: ${{ github.workspace }}/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
          SPARKY_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPARKY_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SPARKY_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :app:bundleRelease --stacktrace

      - name: Get AAB path
        if: github.event_name != 'pull_request'
        id: aab
        run: |
          AAB_PATH=$(find SparkyFitnessMobile/android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          echo "path=$AAB_PATH" >> $GITHUB_OUTPUT
          echo "name=$(basename $AAB_PATH)" >> $GITHUB_OUTPUT

      - name: Test Wear OS app
        if: github.event_name != 'pull_request'
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :wearos:testDebugUnitTest --stacktrace

      # Signed with the phone app's key: the Data Layer only connects the two
      # when package name and signature match.
      - name: Build Wear OS Release APK
        if: github.event_name != 'pull_request'
        env:
          SPARKY_RELEASE_STORE_FILE: ${{ github.workspace }}/SparkyFitnessMobile/android/app/sparky-fitness-release-key.keystore
          SPARKY_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPARKY_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SPARKY_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd SparkyFitnessMobile/android
          ./gradlew :wearos:assembleRelease --stacktrace

      - name: Get version from package.json
        if: github.event_name != 'pull_request'
        id: version
        run: |
          VERSION=$(node -p "require('./SparkyFitnessMobile/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.aab.outputs.path }}
            SparkyFitnessMobile/android/wearos/build/outputs/apk/release/wearos-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
