name: Schema Backup

# Regenerates db_schema_backup.sql from the migrations and commits it to main.
# This replaces hand-running db_backup.sh: the committed file is derived from a
# fresh database that has had every migration applied, so it reflects the
# migrations exactly rather than any developer database (which can drift).
#
# Fork PRs can't receive pushes from GITHUB_TOKEN, so this runs after merge on
# main instead of updating the PR branch. Use workflow_dispatch to force a
# regeneration (e.g. the first run after adding this workflow).

on:
  push:
    branches: [main]
    paths:
      - "SparkyFitnessServer/db/migrations/**"
      - "SparkyFitnessServer/db/rls_policies.sql"
      - "SparkyFitnessServer/db/grantPermissions.ts"
      - "SparkyFitnessServer/utils/dbMigrations.ts"
      - "SparkyFitnessServer/utils/applyRlsPolicies.ts"
      - ".github/workflows/schema-backup.yml"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so two close-together merges can't race on the push.
concurrency:
  group: schema-backup
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate db_schema_backup.sql
    runs-on: ubuntu-latest

    services:
      postgres:
        # Keep in lockstep with the migration-check jobs in ci-tests.yml.
        # pg_dump runs inside this container, so bumping the tag also bumps
        # the pg_dump version recorded in the dump header.
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sparky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: SparkyFitnessServer
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to an empty database
        working-directory: SparkyFitnessServer
        run: pnpm run test:migrations
        env:
          SPARKY_FITNESS_DB_HOST: localhost
          SPARKY_FITNESS_DB_PORT: "5432"
          SPARKY_FITNESS_DB_NAME: sparky_test
          SPARKY_FITNESS_DB_USER: postgres
          SPARKY_FITNESS_DB_PASSWORD: postgres
          SPARKY_FITNESS_APP_DB_USER: sparky_app
          SPARKY_FITNESS_APP_DB_PASSWORD: sparky_app_pw

      # Same flags as db_backup.sh. Running pg_dump inside the service
      # container guarantees its version matches the server's.
      # pg_dump 18 emits \restrict/\unrestrict lines with a token that is
      # random on every run; pin it so an unchanged schema produces an
      # unchanged file.
      - name: Dump schema
        run: |
          docker exec ${{ job.services.postgres.id }} \
            pg_dump -U postgres -d sparky_test --schema-only --no-owner \
            | sed -e 's/^\\restrict .*/\\restrict SparkyFitnessSchemaBackup/' \
                  -e 's/^\\unrestrict .*/\\unrestrict SparkyFitnessSchemaBackup/' \
            > db_schema_backup.sql

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- db_schema_backup.sql; then
            echo "db_schema_backup.sql is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db_schema_backup.sql
          git commit -m "chore: sync db_schema_backup.sql with migrations"
          git pull --rebase origin main
          git push origin main
