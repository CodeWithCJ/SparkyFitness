name: Release Published Notification

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: release-published-notification-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  notify-resolved-issues:
    name: Notify Resolved Issues
    runs-on: ubuntu-latest

    steps:
      - name: Comment on resolved issues
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = release.body || '';
            const tagName = release.tag_name || '';
            const releaseUrl = release.html_url || `https://github.com/${owner}/${repo}/releases/tag/${tagName}`;
            const releaseTitle = release.name || tagName;

            core.info(`Processing release: ${releaseTitle} (${tagName})`);

            const prNumbers = new Set();
            const issueNumbers = new Set();

            // 1. Extract PR numbers from release body (e.g., #123, /pull/123)
            const prRegex = /(?:https:\/\/github\.com\/[^/\s]+\/[^/\s]+\/pull\/(\d+)|#(\d+))/gi;
            let prMatch;
            while ((prMatch = prRegex.exec(body)) !== null) {
              const num = parseInt(prMatch[1] || prMatch[2], 10);
              if (num) prNumbers.add(num);
            }

            core.info(`Found PR candidates in release body: ${Array.from(prNumbers).join(', ')}`);

            // 2. For each PR in the release, find its linked issues
            for (const prNumber of prNumbers) {
              try {
                // Query GraphQL closingIssuesReferences
                const query = `
                  query($owner: String!, $repo: String!, $number: Int!) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        body
                        closingIssuesReferences(first: 50) {
                          nodes {
                            number
                          }
                        }
                      }
                    }
                  }
                `;
                const result = await github.graphql(query, { owner, repo, number: prNumber });
                const prData = result?.repository?.pullRequest;
                const nodes = prData?.closingIssuesReferences?.nodes || [];
                for (const node of nodes) {
                  if (node?.number) issueNumbers.add(node.number);
                }

                // Also parse PR body for issue links
                const prBody = prData?.body || '';
                const issueRegex = /\b(?:(?:closes|close|closed|fixes|fix|fixed|resolves|resolve|resolved|linked issue:?\s*(?:closes|fixes|resolves)?):?\s*#(\d+))/gi;
                let issueMatch;
                while ((issueMatch = issueRegex.exec(prBody)) !== null) {
                  const num = parseInt(issueMatch[1], 10);
                  if (num && num !== prNumber) issueNumbers.add(num);
                }
              } catch (err) {
                core.warning(`Error retrieving PR #${prNumber} details: ${err.message}`);
              }
            }

            // 3. Directly extract any issue references in release notes
            const directIssueRegex = /\b(?:(?:closes|close|closed|fixes|fix|fixed|resolves|resolve|resolved):?\s*#(\d+))/gi;
            let directMatch;
            while ((directMatch = directIssueRegex.exec(body)) !== null) {
              const num = parseInt(directMatch[1], 10);
              if (num) issueNumbers.add(num);
            }

            if (issueNumbers.size === 0) {
              core.info(`No linked issues found for release ${tagName}.`);
              return;
            }

            core.info(`Found resolved issue candidate(s) for release ${tagName}: ${Array.from(issueNumbers).join(', ')}`);

            const NOTIFICATION_TAG = `<!-- sparky-release-${tagName}-notification -->`;

            for (const issueNumber of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });

                if (issue.data.pull_request) {
                  core.info(`#${issueNumber} is a PR, skipping.`);
                  continue;
                }

                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: issueNumber,
                  per_page: 100,
                });

                const alreadyNotified = comments.some(c => (c.body || '').includes(NOTIFICATION_TAG));
                if (alreadyNotified) {
                  core.info(`Issue #${issueNumber} already received release notification for ${tagName}.`);
                  continue;
                }

                const commentBody = [
                  NOTIFICATION_TAG,
                  `🚀 **SparkyFitness ${releaseTitle}** has been released with this update! Check out the [Release Notes](${releaseUrl}).`,
                  '',
                  'Thank you for reporting and supporting SparkyFitness!',
                ].join('\n');

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: commentBody,
                });

                core.info(`Successfully posted release notification on Issue #${issueNumber}.`);
              } catch (err) {
                core.warning(`Failed to notify Issue #${issueNumber}: ${err.message}`);
              }
            }
