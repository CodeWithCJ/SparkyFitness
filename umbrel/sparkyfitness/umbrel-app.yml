manifestVersion: 1
id: sparkyfitness
category: files
name: SparkyFitness
version: "v1.12.0"
tagline: Self-hosted nutrition, exercise, and body metrics tracker
description: >-
  🥗 SparkyFitness is a self-hosted alternative to MyFitnessPal for tracking
  what you eat, how you train, and how your body responds — with all of it
  staying on your own Umbrel.


  This app manages its own accounts and two-factor authentication, so it does
  not use Umbrel's login screen — anyone who can reach its address reaches the
  SparkyFitness sign-in page directly. The first account you create becomes
  the administrator, so create yours before sharing the app. Additional
  members can then sign up and, if they choose, share individual data
  categories with a coach, partner, or family member at a granularity they
  control.


  - Food diary with barcode scanning, custom foods and recipes, meal presets,
  and optional online food databases such as OpenFoodFacts, Nutritionix, and
  FatSecret

  - Exercise logging with a searchable library, workout presets, and repeatable
  weekly workout plans

  - Body measurements, custom trackers, progress photos, and water intake

  - Goals and dashboards for calories, macros, weight trends, and step counts

  - Optional AI nutrition coach you can point at your own local or hosted model

  - Health app sync from iOS and Android via the companion SparkyFitness mobile
  app, a bundled Garmin Connect sync sidecar, and an API for your own
  integrations


  Online food databases and AI features are off until you add your own
  credentials in the app's settings; nothing is sent anywhere by default.
releaseNotes: >-
  - Lab test result management

  - NFC tags for Food & Water logging.

  - Add tag.sparkyfitness.com site for NFC tag links

  - List the dev app in the tag site's iPhone link file

  - Add a setting to read iPhone active calories from the Move ring

  - Build the Wear OS app in the EAS production workflow

  - Log water by tapping an NFC tag

  - Add keyless MapLibre OpenStreetMap map rendering on Android

  - Safe defaults above one server replica

  - Add a readiness endpoint and use it for the Docker health check

  - Attach tracker heart rate to workouts logged in SparkyFitness

  - Optionally adjust percentage macros with exercise calories

  Full release notes: https://github.com/CodeWithCJ/SparkyFitness/releases/tag/v1.12.0

