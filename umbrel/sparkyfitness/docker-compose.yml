services:
  app_proxy:
    environment:
      APP_HOST: sparkyfitness_frontend_1
      APP_PORT: 80
      # SparkyFitness has its own account system, and Umbrel's login is
      # single-owner: a partner or family member signing in with their own
      # SparkyFitness account still hits Umbrel's device-password gate first,
      # which they either share or get locked out of. Turning Umbrel auth off
      # for the whole app hands access control to SparkyFitness's own login
      # (and 2FA) rather than layering the two.
      PROXY_AUTH_ADD: "false"

  db:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    restart: on-failure
    environment:
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${APP_SPARKYFITNESS_DB_PASSWORD}
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker and
      # declares the volume one level up, so the whole directory is mounted.
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    image: codewithcj/sparkyfitness_server:v1.10.0@sha256:375e0f2df6e8e4c54186cfe0cc6acdef6fcf02177314f287c8f037e29ce5d9f0
    restart: on-failure
    # Longer than the server's 15 s shutdown limit, so running work can finish on stop.
    stop_grace_period: 20s
    # Safe now that SPARKY_FITNESS_CUSTOM_TEMP_DIRECTORY points multer's disk
    # storage at a bind-mounted directory this uid owns. Without that variable
    # multer creates temp_uploads/ inside the image's own root-owned
    # application directory at startup, and the server exits with EACCES
    # before it ever listens.
    user: "1000:1000"
    depends_on:
      db:
        # The server applies migrations before it listens, so it must not race
        # Postgres while it is still initialising.
        condition: service_healthy
    environment:
      # --- Database ---
      SPARKY_FITNESS_DB_HOST: sparkyfitness_db_1
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${APP_SPARKYFITNESS_DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_SPARKYFITNESS_APP_DB_PASSWORD}

      # --- Secrets ---
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${APP_SPARKYFITNESS_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${APP_SPARKYFITNESS_BETTER_AUTH_SECRET}

      # --- Origins and proxying ---
      # Primary browser origin, used for CORS and Better Auth trusted origins.
      SPARKY_FITNESS_FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      # umbrelOS serves every app port over both HTTP and TLS, and the mobile
      # app refuses a plain-HTTP server, so the HTTPS origin has to be trusted
      # too. ALLOW_PRIVATE_NETWORK_CORS below does not cover it: that check only
      # recognises IP literals and localhost, never a .local name.
      # The Tor origin is computed in exports.sh, not here: APP_HIDDEN_SERVICE
      # is never actually empty (umbrelOS fills it with a placeholder such as
      # "not-enabled.onion" before a real hidden service exists), so a Compose
      # ${VAR:+...} guard can't tell a placeholder from a real address. Only
      # bash can make that distinction.
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: https://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}${APP_SPARKYFITNESS_TOR_ORIGIN}
      # Umbrel is reached over plain HTTP on the LAN, commonly by IP rather than
      # by .local name. This trusts private-network origins and drops the Secure
      # cookie flag, without which sign-in fails on every non-HTTPS origin.
      ALLOW_PRIVATE_NETWORK_CORS: "true"
      # Two hops, not the default of one: app_proxy overwrites X-Forwarded-For
      # with the client address, then the frontend's nginx appends its own
      # upstream address ($remote_addr, i.e. app_proxy's container IP) on top
      # of that. Stripping only one hop leaves req.ip on app_proxy for every
      # visitor, which puts the whole household in one sign-in rate-limit
      # bucket and one audit-log identity.
      SPARKY_FITNESS_TRUSTED_PROXY_HOPS: "2"
      # Garmin sync sidecar, bundled below. Otherwise unset, which the server
      # falls back to localhost:8000 for -- silently talking to itself.
      GARMIN_MICROSERVICE_URL: http://sparkyfitness_garmin_1:8000
      # multer's disk storage (routes/backupRoutes.ts) otherwise writes inside
      # the image's own root-owned application directory, which this uid can't
      # do. Bind-mounted so it survives restarts like uploads and backups do,
      # rather than resetting on every container recreate.
      SPARKY_FITNESS_CUSTOM_TEMP_DIRECTORY: /app/SparkyFitnessServer/data/upload-tmp

      # --- Runtime ---
      NODE_ENV: production
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_LOG_LEVEL: ERROR
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/app/SparkyFitnessServer/uploads
      - ${APP_DATA_DIR}/data/backup:/app/SparkyFitnessServer/backup
      - ${APP_DATA_DIR}/data/upload-tmp:/app/SparkyFitnessServer/data/upload-tmp
    healthcheck:
      # Startup runs migrations before the server listens, so allow for a slow
      # first boot on a Raspberry Pi before counting failures.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3010/api/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    image: codewithcj/sparkyfitness:v1.10.0@sha256:864b052f7cbbc522f5bea2b2696c3734ba79e873abf9f144cb261ad3bd3539e5
    restart: on-failure
    depends_on:
      server:
        # nginx resolves the backend upstream when it loads its config, so it
        # must not start before the server container answers.
        condition: service_healthy
    environment:
      # Where the frontend's nginx proxies /api, /health-data and /uploads.
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness_server_1
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      # nginx's login rate limiter keys on $binary_remote_addr, which is the
      # raw TCP peer -- always app_proxy's container IP, never the real
      # visitor, since every request arrives through it. The default 5r/s is
      # a per-user budget but lands on the whole household here; widen it so
      # one member signing in doesn't 429 everyone else.
      NGINX_RATE_LIMIT: 20r/s

  garmin:
    image: codewithcj/sparkyfitness_garmin:v1.10.0@sha256:46fe22cf5bc9ae65d68991e0a9bc3443ba987f8f94eaae606d37fd89ef7ba5b7
    restart: on-failure
    # Stateless: no bind mount, and GARMIN_SERVICE_PORT / GARMIN_SERVICE_IS_CN
    # both default sanely (8000 / false) when unset.
