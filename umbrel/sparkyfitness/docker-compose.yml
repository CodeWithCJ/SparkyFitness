services:
  app_proxy:
    environment:
      APP_HOST: sparkyfitness_frontend_1
      APP_PORT: 80
      # SparkyFitness has its own account system, and these are the only paths
      # the companion mobile app, Health/Google Fit sync, and API-key clients
      # ever call. None of them can carry an Umbrel auth cookie, so they are
      # whitelisted and left to Better Auth and the app's own API-key checks.
      # The web UI itself stays behind Umbrel auth.
      PROXY_AUTH_WHITELIST: "/api,/api/*,/health-data,/health-data/*,/uploads/*,/mcp,/mcp/*"

  db:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    restart: on-failure
    environment:
      POSTGRES_DB: sparkyfitness_db
      POSTGRES_USER: sparky
      POSTGRES_PASSWORD: ${APP_SPARKYFITNESS_DB_PASSWORD}
    volumes:
      # postgres:18 keeps PGDATA under /var/lib/postgresql/18/docker and
      # declares the volume one level up, so the whole directory is mounted.
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparky -d sparkyfitness_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    image: codewithcj/sparkyfitness_server:v1.7.2@sha256:a3562bb89cf0c7f8394bc2728776d9ba42327aaabf831ef35f00e0fe1ee47a93
    restart: on-failure
    # Runs as root deliberately. The image creates temp_uploads/ inside its own
    # root-owned application directory at startup (multer's disk storage in
    # routes/backupRoutes.ts), so user: "1000:1000" makes the server exit with
    # EACCES before it ever listens.
    depends_on:
      db:
        # The server applies migrations before it listens, so it must not race
        # Postgres while it is still initialising.
        condition: service_healthy
    environment:
      # --- Database ---
      SPARKY_FITNESS_DB_HOST: sparkyfitness_db_1
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: sparkyfitness_db
      SPARKY_FITNESS_DB_USER: sparky
      SPARKY_FITNESS_DB_PASSWORD: ${APP_SPARKYFITNESS_DB_PASSWORD}
      SPARKY_FITNESS_APP_DB_USER: sparky_app
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_SPARKYFITNESS_APP_DB_PASSWORD}

      # --- Secrets ---
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${APP_SPARKYFITNESS_API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${APP_SPARKYFITNESS_BETTER_AUTH_SECRET}

      # --- Origins and proxying ---
      # Primary browser origin, used for CORS and Better Auth trusted origins.
      SPARKY_FITNESS_FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
      # Also accept the app's Tor hidden service when remote access is enabled.
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: http://${APP_HIDDEN_SERVICE}
      # Umbrel is reached over plain HTTP on the LAN, commonly by IP rather than
      # by .local name. This trusts private-network origins and drops the Secure
      # cookie flag, without which sign-in fails on every non-HTTPS origin.
      ALLOW_PRIVATE_NETWORK_CORS: "true"
      # Trusted proxy hops is left at the default of 1: app_proxy overwrites
      # X-Forwarded-For with the client address and the frontend's nginx appends
      # one hop, so stripping a single entry yields the real client IP.

      # --- Runtime ---
      NODE_ENV: production
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_LOG_LEVEL: ERROR
    volumes:
      - ${APP_DATA_DIR}/data/uploads:/app/SparkyFitnessServer/uploads
      - ${APP_DATA_DIR}/data/backup:/app/SparkyFitnessServer/backup
    healthcheck:
      # Startup runs migrations before the server listens, so allow for a slow
      # first boot on a Raspberry Pi before counting failures.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3010/api/health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    image: codewithcj/sparkyfitness:v1.7.2@sha256:2fe089fb28bbfdc634b702d2a85f8fa0e2c6c7f39c713fd0762f295657cf4c28
    restart: on-failure
    depends_on:
      server:
        # nginx resolves the backend upstream when it loads its config, so it
        # must not start before the server container answers.
        condition: service_healthy
    environment:
      # Where the frontend's nginx proxies /api, /health-data and /uploads.
      SPARKY_FITNESS_SERVER_HOST: sparkyfitness_server_1
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_FRONTEND_URL: http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}
