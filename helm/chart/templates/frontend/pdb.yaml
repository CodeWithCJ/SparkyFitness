{{- if include "sparkyfitness.pdbEnabled" (dict "pdb" .Values.frontend.podDisruptionBudget "replicas" .Values.frontend.replicas) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sparkyfitness.fullname" . }}-frontend
  labels:
    {{- include "sparkyfitness.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- include "sparkyfitness.pdbSpec" (dict "pdb" .Values.frontend.podDisruptionBudget "component" "frontend") | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sparkyfitness.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
{{- end }}
