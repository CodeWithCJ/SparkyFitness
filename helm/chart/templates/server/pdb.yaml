{{- if include "sparkyfitness.pdbEnabled" (dict "pdb" .Values.server.podDisruptionBudget "replicas" .Values.server.replicas "singleNode" .Values.server.persistence.allowSingleNodeVolumes) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sparkyfitness.fullname" . }}-server
  labels:
    {{- include "sparkyfitness.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- include "sparkyfitness.pdbSpec" (dict "pdb" .Values.server.podDisruptionBudget "component" "server") | nindent 2 }}
  selector:
    matchLabels:
      {{- include "sparkyfitness.selectorLabels" . | nindent 6 }}
      sparkyfitness.io/server: "true"
{{- end }}
