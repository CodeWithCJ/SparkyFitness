{{- /*
With server.replicas above 1, one of those replicas runs as a separate
"-jobs" Deployment that runs the scheduled jobs, and the rest set
SPARKY_FITNESS_DISABLE_SCHEDULED_JOBS so each job runs once. Both render from
this template, and both carry the sparkyfitness.io/server label that the
Service and NetworkPolicies select on.

Several pods can only share a volume that attaches on more than one node, so
replicas above 1 require ReadWriteMany backup and uploads volumes, unless
server.persistence.allowSingleNodeVolumes declares that every pod runs on one
node. A single replica on a ReadWriteOnce volume keeps Recreate, because a
surge pod on another node could never attach it.
*/}}
{{- $replicas := int .Values.server.replicas }}
{{- $splitJobs := gt $replicas 1 }}
{{- $shutdownTimeout := ternary "" (toString .Values.server.shutdownTimeoutSeconds) (kindIs "invalid" .Values.server.shutdownTimeoutSeconds) }}
{{- if and $shutdownTimeout (or (not (regexMatch "^[1-9][0-9]{0,3}$" $shutdownTimeout)) (gt (atoi $shutdownTimeout) 3600)) }}
{{- fail "server.shutdownTimeoutSeconds must be a whole number of seconds from 1 to 3600" }}
{{- end }}
{{- $singleNodeVolumes := list }}
{{- range $volume := list "backup" "uploads" }}
{{- if include "sparkyfitness.serverVolumeSingleNode" (dict "root" $ "volume" $volume) }}
{{- $singleNodeVolumes = append $singleNodeVolumes $volume }}
{{- end }}
{{- end }}
{{- /* ReadWriteOncePod never admits a second pod, even on the same node. */}}
{{- $refusedVolumes := list }}
{{- range $volume := $singleNodeVolumes }}
{{- if or (not $.Values.server.persistence.allowSingleNodeVolumes) (eq (index $.Values.server.persistence $volume).accessMode "ReadWriteOncePod") }}
{{- $refusedVolumes = append $refusedVolumes $volume }}
{{- end }}
{{- end }}
{{- if and (gt $replicas 1) $refusedVolumes }}
{{- fail (printf "server.replicas=%d needs volumes that every replica can mount, but these are not ReadWriteMany: server.persistence.%s.accessMode. Set accessMode: ReadWriteMany with a StorageClass that supports it, or set existingClaim to a ReadWriteMany claim and accessMode: ReadWriteMany to declare it. On a single-node cluster, server.persistence.allowSingleNodeVolumes: true accepts ReadWriteOnce volumes." $replicas (join ".accessMode, server.persistence." $refusedVolumes)) }}
{{- end }}
{{- $strategy := .Values.server.strategy }}
{{- if not $strategy }}
{{- if or (gt $replicas 1) (not $singleNodeVolumes) }}
{{- $strategy = dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 1 "maxUnavailable" 0) }}
{{- else }}
{{- $strategy = dict "type" "Recreate" }}
{{- end }}
{{- end }}
{{- $rolling := or (gt $replicas 1) (ne ($strategy.type | default "RollingUpdate") "Recreate") }}
{{- $serverSelector := printf "%s\nsparkyfitness.io/server: \"true\"" (include "sparkyfitness.selectorLabels" .) }}
{{- $roles := list "server" }}
{{- if $splitJobs }}{{- $roles = append $roles "jobs" }}{{- end }}
{{- range $role := $roles }}
{{- with $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sparkyfitness.fullname" . }}-{{ $role }}
  labels:
    {{- include "sparkyfitness.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  {{- if eq $role "jobs" }}
  replicas: 1
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ ternary (sub $replicas 1) $replicas $splitJobs }}
  strategy:
    {{- toYaml $strategy | nindent 4 }}
  {{- end }}
  {{- with include "sparkyfitness.minReadySeconds" (dict "values" .Values.server "rolling" $rolling) }}
  minReadySeconds: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sparkyfitness.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $role }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "sparkyfitness.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $role }}
        sparkyfitness.io/server: "true"
    spec:
      {{- if and .Values.global.serviceAccount.create .Values.server.serviceAccount.create }}
      serviceAccountName: {{ include "sparkyfitness.fullname" . }}-server
      {{- end }}
      {{- include "sparkyfitness.imagePullSecrets" . | nindent 6 }}
      {{- /* The preStop sleep runs inside the grace period, before the server's own shutdown timeout (default 15) starts. */}}
      {{- $grace := add (ternary (atoi $shutdownTimeout) 15 (ne $shutdownTimeout "")) (include "sparkyfitness.preStopDelay" (dict "values" .Values.server "rolling" $rolling) | int) 5 }}
      {{- if or $shutdownTimeout (gt (int $grace) 30) }}
      # Kubernetes kills the pod after this; the server stops itself within its timeout.
      terminationGracePeriodSeconds: {{ $grace }}
      {{- end }}
      {{- with .Values.server.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.postgresql.enabled }}
        - name: wait-for-db
          {{- /*
          Image is constructed as repository:tag to exactly match how the
          HelmForge postgresql subchart references its own image. HelmForge
          exposes no image helper and does not honour global.imageRegistry,
          so using sparkyfitness.image here would be inconsistent and could
          double-apply a registry prefix. Set postgresql.image.repository to
          the full registry path if mirroring to a private registry.
          */}}
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "sparkyfitness.databaseHost" . }} -p {{ include "sparkyfitness.databasePort" . }}; do echo "Waiting for database..."; sleep 2; done
          securityContext:
            runAsUser: {{ .Values.postgresql.podSecurityContext.runAsUser | default 999 }}
            runAsGroup: {{ .Values.postgresql.podSecurityContext.runAsGroup | default 999 }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
        {{- with .Values.server.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: server
          image: {{ include "sparkyfitness.image" (dict "image" .Values.server.image "global" .Values.global "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          {{- with .Values.server.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "sparkyfitness.configmapName" . }}
            {{- with .Values.server.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # --- App secrets ---
            - name: SPARKY_FITNESS_API_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.appSecretName" . }}
                  key: {{ .Values.server.secrets.existingSecretKeys.apiEncryptionKey | default "api_encryption_key" }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.appSecretName" . }}
                  key: {{ .Values.server.secrets.existingSecretKeys.betterAuthSecret | default "better_auth_secret" }}
            # --- App database credentials (limited-privilege user) ---
            - name: SPARKY_FITNESS_APP_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.appDbSecretName" . }}
                  key: {{ .Values.server.appDatabase.existingSecretKeys.username | default "username" }}
            - name: SPARKY_FITNESS_APP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.appDbSecretName" . }}
                  key: {{ .Values.server.appDatabase.existingSecretKeys.password | default "password" }}
            # --- Database credentials (owner) ---
            - name: SPARKY_FITNESS_DB_USER
              {{- if .Values.postgresql.enabled }}
              value: {{ .Values.postgresql.auth.username | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.databaseSecretName" . }}
                  key: {{ .Values.externalDatabase.auth.existingSecretKeys.username | default "username" }}
              {{- end }}
            - name: SPARKY_FITNESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.databaseSecretName" . }}
                  {{- if .Values.postgresql.enabled }}
                  key: user-password
                  {{- else }}
                  key: {{ .Values.externalDatabase.auth.existingSecretKeys.password | default "password" }}
                  {{- end }}
            {{- if .Values.config.oidc.enabled }}
            # --- OIDC credentials ---
            - name: SPARKY_FITNESS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.oidcSecretName" . }}
                  key: {{ .Values.config.oidc.secrets.existingSecretKeys.clientId | default "client_id" }}
            - name: SPARKY_FITNESS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.oidcSecretName" . }}
                  key: {{ .Values.config.oidc.secrets.existingSecretKeys.clientSecret | default "client_secret" }}
            {{- end }}
            {{- if .Values.config.email.enabled }}
            # --- SMTP credentials ---
            - name: SPARKY_FITNESS_EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.smtpSecretName" . }}
                  key: {{ .Values.config.email.secrets.existingSecretKeys.username | default "username" }}
            - name: SPARKY_FITNESS_EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "sparkyfitness.smtpSecretName" . }}
                  key: {{ .Values.config.email.secrets.existingSecretKeys.password | default "password" }}
            {{- end }}
            {{- if and $splitJobs (eq $role "server") }}
            - name: SPARKY_FITNESS_DISABLE_SCHEDULED_JOBS
              value: "true"
            {{- end }}
            {{- if $shutdownTimeout }}
            - name: SPARKY_FITNESS_SHUTDOWN_TIMEOUT_SECONDS
              value: {{ $shutdownTimeout | quote }}
            {{- end }}
            {{- if kindIs "slice" .Values.server.extraEnv }}
            {{- toYaml .Values.server.extraEnv | nindent 12 }}
            {{- else }}
            {{- range $k, $v := .Values.server.extraEnv }}
            - name: {{ $k }}
              {{- if kindIs "map" $v }}
              {{- toYaml $v | nindent 14 }}
              {{- else }}
              value: {{ $v | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
          {{- with include "sparkyfitness.lifecycle" (dict "values" .Values.server "rolling" $rolling) }}
          lifecycle:
            {{- . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: backup
              mountPath: {{ .Values.server.persistence.backup.mountPath }}
            - name: uploads
              mountPath: {{ .Values.server.persistence.uploads.mountPath }}
            - name: temp-uploads
              mountPath: {{ .Values.server.persistence.tempUploads.mountPath }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.server.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: {{ .Values.server.persistence.backup.existingClaim | default (printf "%s-server-backup" (include "sparkyfitness.fullname" .)) | quote }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ .Values.server.persistence.uploads.existingClaim | default (printf "%s-server-uploads" (include "sparkyfitness.fullname" .)) | quote }}
        - name: temp-uploads
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.server.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "sparkyfitness.topologySpread" (dict "values" .Values.server "replicas" $replicas "selector" $serverSelector) }}
      topologySpreadConstraints:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
